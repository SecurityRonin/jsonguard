[package]
name = "jsonguard"
version = "0.2.6"
edition = "2021"
rust-version = "1.75"
authors = ["Security Ronin Ltd"]
license = "Apache-2.0"
description = "Input inspection and output sanitization for JSON/JSONL, CSV, and TSV — guards against formula injection, bidi-override, control-character, and encoding attacks."
repository = "https://github.com/SecurityRonin/jsonguard"
homepage = "https://github.com/SecurityRonin/jsonguard"
documentation = "https://docs.rs/jsonguard"
keywords = ["json", "csv", "sanitize", "injection", "formula-injection"]
categories = ["encoding", "text-processing", "parser-implementations"]
readme = "README.md"

# no_std compatible; alloc enables Cow/String APIs; std adds nothing yet.
[features]
default = ["alloc"]
alloc = []           # Cow<'_, str> / String return types
std = ["alloc"]      # std::error::Error impl, future Write impls
nosql = ["alloc"]    # MongoDB, Elasticsearch, Redis helpers
binary = ["alloc"]   # BSON, MessagePack, Protocol Buffers advisories
serde = ["dep:serde", "alloc"] # JsonSafe<'_>: serde-serializable safe JSON string
full = ["std", "nosql", "binary"]

[dependencies]
serde = { version = "1", optional = true, default-features = false }

[dev-dependencies]
proptest = "1"
serde_json = "1"

[[test]]
name = "real_world_samples"
required-features = ["alloc"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
correctness = "deny"
suspicious = "deny"
unwrap_used = "deny"
expect_used = "deny"
# The public API is `fn f<I: GuardInput>(input: I)` — generic-by-value is the
# design seam that lets a caller pass &str, &[u8] or String unchanged. Taking
# `&I` instead would break every caller and defeat the trait. Not a defect.
needless_pass_by_value = { level = "allow", priority = 1 }
module_name_repetitions = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
cast_possible_wrap = { level = "allow", priority = 1 }
cast_sign_loss = { level = "allow", priority = 1 }
cast_precision_loss = { level = "allow", priority = 1 }
